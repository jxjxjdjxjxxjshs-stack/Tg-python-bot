<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE</title>
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .screen {
            display: none;
            width: 100%;
            box-sizing: border-box;
        }
        .active { display: block; }
        h3 { color: #4fc1ff; text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2d2d2d;
            color: #9cdcfe;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { background-color: #1177bb; }
        .back-btn {
            background-color: #333333;
            color: #4fc1ff;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-weight: normal;
            width: auto;
            display: inline-block;
        }
        #console-output {
            width: 100%;
            min-height: 200px;
            background-color: #000000;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-y: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВВОД КОДА -->
    <div id="editor-screen" class="screen active">
        <h3>💻 Введи свой Python-код:</h3>
        <textarea id="codeArea" placeholder="print('Привет!')"></textarea>
        <button id="runBtn" onclick="runPython()">Запустить код 🚀</button>
    </div>

    <!-- ЭКРАН 2: РЕЗУЛЬТАТ ВЫПОЛНЕНИЯ -->
    <div id="output-screen" class="screen">
        <button class="back-btn" onclick="goBack()">⬅ Назад к коду</button>
        <h3>📝 Результат выполнения:</h3>
        <div id="console-output">Загрузка консоли Python...</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let pyodideInstance = null;

        // Запуск встроенного Python
        initPython();
        async function initPython() {
            try {
                pyodideInstance = await loadPyodide();
                console.log("Python готов!");
            } catch (e) {
                document.getElementById("console-output").innerText = "Ошибка загрузки Python.";
            }
        }

        async function runPython() {
            let userCode = document.getElementById("codeArea").value;
            let outputDiv = document.getElementById("console-output");
            
            if (!userCode.trim()) {
                alert("Пожалуйста, напиши код!");
                return;
            }

            // Переключаем экраны
            document.getElementById("editor-screen").classList.remove("active");
            document.getElementById("output-screen").classList.add("active");
            outputDiv.innerText = "Выполняю... ⏳";

            if (!pyodideInstance) {
                outputDiv.innerText = "Подождите пару секунд, Python ещё загружается...";
                return;
            }

            try {
                // Настраиваем вывод print()
                pyodideInstance.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);
                
                // Исправляем заглавную букву Print от телефона
                let fixedCode = userCode.replace(/Print\s*\(/g, "print(");
                
                // Выполняем код
                await pyodideInstance.runPythonAsync(fixedCode);
                
                // Забираем результат
                let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
                outputDiv.innerText = stdout || "Код выполнился успешно, но ничего не вывел (используйте print()).";
            } catch (err) {
                outputDiv.innerText = "❌ Ошибка в коде:\n" + err.message;
            }
        }

        function goBack() {
            // Возвращаемся на экран ввода кода
            document.getElementById("output-screen").classList.remove("active");
            document.getElementById("editor-screen").classList.add("active");
            
            // Восстанавливаем кнопку запуска
            let btn = document.getElementById("runBtn");
            btn.innerText = "Запустить код 🚀";
            btn.disabled = false;
        }
    </script>
</body>
</html>
