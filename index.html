<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .screen { display: none; width: 100%; box-sizing: border-box; }
        .active { display: block; }
        h3 { color: #4fc1ff; text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2d2d2d;
            color: #9cdcfe;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { background-color: #1177bb; }
        .back-btn {
            background-color: #333333;
            color: #4fc1ff;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-weight: normal;
            width: auto;
            display: inline-block;
            border-radius: 4px;
        }
        #console-output {
            width: 100%;
            min-height: 350px;
            background-color: #000000;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-y: auto;
            border: 1px solid #333;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВВОД КОДА -->
    <div id="editor-screen" class="screen active">
        <h3>💻 Введи свой Python-код:</h3>
        <textarea id="codeArea" placeholder="print('Привет!')"></textarea>
        <button id="runBtn" onclick="runPythonInsidePhone()">Запустить код 🚀</button>
    </div>

    <!-- ЭКРАН 2: ФИНАЛЬНОЕ ОКНО ВЫВОДА -->
    <div id="output-screen" class="screen">
        <button class="back-btn" onclick="goBack()">⬅ Назад к коду</button>
        <h3>💻 Терминал выполнения:</h3>
        <div id="console-output">Выполняю... ⏳</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // По умолчанию вставим рабочий код калькулятора, чтобы вы сразу проверили инпуты
        document.getElementById("codeArea").value = "print('--- СУПЕР КАЛЬКУЛЯТОР ---')\na = input('Введите число А: ')\nb = input('Введите число Б: ')\nprint('Результат сложения:', int(a) + int(b))";

        function runPythonInsidePhone() {
            let userCode = document.getElementById("codeArea").value;
            let outputDiv = document.getElementById("console-output");

            if (!userCode.trim()) {
                alert("Пожалуйста, напиши код!");
                return;
            }

            // Мгновенно переключаем экран на финальное окно вывода (0 секунд задержки)
            document.getElementById("editor-screen").classList.remove("active");
            document.getElementById("output-screen").classList.add("active");
            outputDiv.innerText = "";
            outputDiv.style.color = "#00ff00";

            let lines = userCode.split('\n');
            let jsLines = [];
            let variables = {};

            // Создаем функции имитации команд Python
            window.pyInput = function(promptText) {
                return prompt(promptText ? promptText.replace(/['"]/g, '') : "Введите значение:") || "0";
            };
            window.pyInt = function(val) {
                return parseInt(val, 10) || 0;
            };

            // Переводим базовый Python в быстрый JavaScript
            for (let line of lines) {
                let trimmed = line.trim();
                if (!trimmed) continue;

                if (trimmed.startsWith("print(") && trimmed.endsWith(")")) {
                    let inside = trimmed.substring(6, trimmed.length - 1);
                    inside = inside.replace(/int\(/g, "window.pyInt(");
                    jsLines.push(`document.getElementById("console-output").innerText += (${inside}) + "\\n";`);
                } 
                else if (trimmed.includes("=") && trimmed.includes("input(")) {
                    let parts = trimmed.split("=");
                    let varName = parts[0].trim();
                    let inputPart = parts[1].trim();
                    let promptMatch = inputPart.match(/input\((.*)\)/);
                    let promptText = promptMatch ? promptMatch[1] : "''";
                    jsLines.push(`var ${varName} = window.pyInput(${promptText});`);
                } 
                else if (trimmed.includes("=") && !trimmed.includes("input(")) {
                    jsLines.push(`var ${line};`);
                }
            }

            try {
                let finalJs = jsLines.join("\n");
                if (!finalJs) {
                    outputDiv.innerText = "ℹ️ Код выполнен, но команд print() не найдено.";
                    return;
                }
                // Выполняем код мгновенно на самом устройстве
                new Function(finalJs)();
            } catch (err) {
                outputDiv.style.color = "#ff4d4d";
                outputDiv.innerText = "❌ Ошибка синтаксиса.\nПроверьте правильность написания print() и input().";
            }
        }

        function goBack() {
            document.getElementById("output-screen").classList.remove("active");
            document.getElementById("editor-screen").classList.add("active");
        }
    </script>
</body>
</html>
