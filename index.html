<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE</title>
    <script src="https://telegram.org"></script>
    <!-- Подключаем стабильные и быстрые скрипты Python -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .screen { display: none; width: 100%; box-sizing: border-box; }
        .active { display: block; }
        h3 { color: #4fc1ff; text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2d2d2d;
            color: #9cdcfe;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { background-color: #1177bb; }
        .back-btn {
            background-color: #333333;
            color: #4fc1ff;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-weight: normal;
            width: auto;
            display: inline-block;
            border-radius: 4px;
        }
        #console-output {
            width: 100%;
            min-height: 250px;
            background-color: #000000;
            color: #00ff00; /* Хакерский зеленый цвет */
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-y: auto;
            border: 1px solid #333;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВВОД КОДА -->
    <div id="editor-screen" class="screen active">
        <h3>💻 Введи свой Python-код:</h3>
        <textarea id="codeArea" placeholder="print('hello')"></textarea>
        <button id="runBtn" onclick="runPythonCode()">Запустить код 🚀</button>
    </div>

    <!-- ЭКРАН 2: РЕЗУЛЬТАТ -->
    <div id="output-screen" class="screen">
        <button class="back-btn" onclick="goBack()">⬅ Назад к коду</button>
        <h3>📝 Результат выполнения:</h3>
        <div id="console-output">Выполняю... ⏳</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        function runPythonCode() {
            let userCode = document.getElementById("codeArea").value;
            let outputDiv = document.getElementById("console-output");

            if (!userCode.trim()) {
                alert("Пожалуйста, напиши код!");
                return;
            }

            // Переключаем экран на результат
            document.getElementById("editor-screen").classList.remove("active");
            document.getElementById("output-screen").classList.add("active");
            outputDiv.innerText = "";

            // Настраиваем перехват вывода print()
            Sk.configure({
                output: function(text) {
                    outputDiv.innerText += text;
                },
                read: builtinRead
            });

            // Авто-исправление заглавной буквы Print от телефона
            let fixedCode = userCode.replace(/Print/g, "print");

            // Запускаем Python прямо внутри смартфона
            Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, fixedCode, true);
            }).then(function(mod) {
                if (outputDiv.innerText === "") {
                    outputDiv.innerText = "ℹ️ Код выполнен успешно, но ничего не вывел.\nИспользуйте print('текст'), чтобы увидеть результат.";
                }
            }, function(err) {
                // Если в коде ошибка — подсветим её красным
                outputDiv.style.color = "#ff4d4d";
                outputDiv.innerText = "❌ Ошибка в Python коде:\n\n" + err.toString();
            });
        }

        function goBack() {
            document.getElementById("console-output").style.color = "#00ff00";
            document.getElementById("output-screen").classList.remove("active");
            document.getElementById("editor-screen").classList.add("active");
        }
    </script>
</body>
</html>
