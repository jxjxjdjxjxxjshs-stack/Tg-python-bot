<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE</title>
    <!-- Подключаем скрипт Telegram и супер-легкий Python -->
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .screen { display: none; width: 100%; box-sizing: border-box; }
        .active { display: block; }
        h3 { color: #4fc1ff; text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2d2d2d;
            color: #9cdcfe;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { background-color: #1177bb; }
        .back-btn {
            background-color: #333333;
            color: #4fc1ff;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-weight: normal;
            width: auto;
            display: inline-block;
        }
        #console-output {
            width: 100%;
            min-height: 250px;
            background-color: #000000;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-y: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: РЕДАКТОР -->
    <div id="editor-screen" class="screen active">
        <h3>💻 Введи свой Python-код:</h3>
        <textarea id="codeArea" placeholder="print('hello')"></textarea>
        <button id="runBtn" onclick="runPythonCode()">Запустить код 🚀</button>
    </div>

    <!-- ЭКРАН 2: РЕЗУЛЬТАТ -->
    <div id="output-screen" class="screen">
        <button class="back-btn" onclick="goBack()">⬅ Назад к коду</button>
        <h3>📝 Результат выполнения:</h3>
        <div id="console-output">Выполняю... ⏳</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        function runPythonCode() {
            let userCode = document.getElementById("codeArea").value;
            let outputDiv = document.getElementById("console-output");

            if (!userCode.trim()) {
                alert("Пожалуйста, напиши код!");
                return;
            }

            // Мгновенное переключение экрана
            document.getElementById("editor-screen").classList.remove("active");
            document.getElementById("output-screen").classList.add("active");
            outputDiv.innerText = "";

            // Настройка вывода текста
            Sk.configure({
                output: function(text) {
                    outputDiv.innerText += text;
                },
                read: builtinRead
            });

            // Исправляем автоматическую заглавную букву Print от телефона
            let fixedCode = userCode.replace(/Print\s*\(/g, "print(");

            // Мгновенный запуск Python прямо на телефоне
            Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, fixedCode, true);
            }).then(function(mod) {
                if (outputDiv.innerText === "") {
                    outputDiv.innerText = "Код успешно выполнен, но ничего не вывел (используйте print()).";
                }
            }, function(err) {
                outputDiv.innerText = "❌ Ошибка в коде:\n" + err.toString();
            });
        }

        function goBack() {
            document.getElementById("output-screen").classList.remove("active");
            document.getElementById("editor-screen").classList.add("active");
        }
    </script>
</body>
</html>
