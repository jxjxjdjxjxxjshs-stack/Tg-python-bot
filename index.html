<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .screen { display: none; width: 100%; box-sizing: border-box; }
        .active { display: block; }
        h3 { color: #4fc1ff; text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2d2d2d;
            color: #9cdcfe;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { background-color: #1177bb; }
        .back-btn {
            background-color: #333333;
            color: #4fc1ff;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-weight: normal;
            width: auto;
            display: inline-block;
            border-radius: 4px;
        }
        #console-output {
            width: 100%;
            min-height: 350px;
            background-color: #000000;
            color: #00ff00; /* Хакерский зеленый цвет текста */
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-y: auto;
            border: 1px solid #333;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВВОД КОДА -->
    <div id="editor-screen" class="screen active">
        <h3>💻 Введи свой Python-код:</h3>
        <textarea id="codeArea" placeholder="print('Привет!')&#10;a = 15&#10;b = 20&#10;print('Ответ:', a + b)"></textarea>
        <button id="runBtn" onclick="sendCodeToServer()">Запустить код 🚀</button>
    </div>

    <!-- ЭКРАН 2: ВАШ ФИНАЛЬНЫЙ ЭКРАН ВЫВОДА -->
    <div id="output-screen" class="screen">
        <button class="back-btn" onclick="goBack()">⬅ Назад к коду</button>
        <h3>💻 Терминал выполнения:</h3>
        <!-- Сюда JavaScript принудительно вставит текст ответа -->
        <div id="console-output">Связываюсь с сервером... ⏳</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendCodeToServer() {
            let userCode = document.getElementById("codeArea").value;
            let outputDiv = document.getElementById("console-output");

            if (!userCode.trim()) {
                alert("Пожалуйста, напиши код!");
                return;
            }

            // Мгновенно включаем экран с черным блоком
            document.getElementById("editor-screen").classList.remove("active");
            document.getElementById("output-screen").classList.add("active");
            outputDiv.innerText = "Код отправлен на Render... ⏳";
            outputDiv.style.color = "#00ff00";

            // Точный адрес вашего сервера в сети
            let backendUrl = "https://python-bot-75te.onrender.com";

            // Отправляем POST запрос с кодом на сервер Render
            fetch(backendUrl + '/api/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: userCode })
            })
            .then(response => {
                if (!response.ok) throw new Error("Ошибка сервера");
                return response.json();
            })
            .then(data => {
                // Магия: Вставляем текст ответа прямо внутрь черного блока на экране!
                outputDiv.innerText = data.output;
            })
            .catch(err => {
                outputDiv.style.color = "#ff4d4d"; // Красный цвет для ошибки
                outputDiv.innerText = "❌ Ошибка соединения.\nУбедитесь, что сервер на Render активен (статус Live). Если бот долго спал, подождите 20 секунд и нажмите «Назад к коду» -> «Запустить» ещё раз.";
            });
        }

        function goBack() {
            document.getElementById("output-screen").classList.remove("active");
            document.getElementById("editor-screen").classList.add("active");
        }
    </script>
</body>
</html>
