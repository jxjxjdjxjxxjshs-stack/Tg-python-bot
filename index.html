<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Интерактивная Консоль</title>
    <script src="https://telegram.org"></script>
    <!-- Быстрые и надежные скрипты Python-движка -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .screen { display: none; width: 100%; box-sizing: border-box; }
        .active { display: block; }
        h3 { color: #4fc1ff; text-align: center; margin-top: 0; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #2d2d2d;
            color: #9cdcfe;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { background-color: #1177bb; }
        .back-btn {
            background-color: #333333;
            color: #4fc1ff;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-weight: normal;
            width: auto;
            display: inline-block;
            border-radius: 4px;
        }
        
        /* Стили интерактивного терминала */
        #terminal {
            width: 100%;
            height: calc(100vh - 140px);
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 15px;
        }
        #console-output {
            color: #00ff00; /* Зеленый текст */
            white-space: pre-wrap;
            display: inline;
        }
        .input-line {
            display: none;
            align-items: center;
            margin-top: 5px;
            width: 100%;
        }
        #prompt-text {
            color: #00ff00;
            white-space: pre;
            margin-right: 5px;
        }
        #terminal-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            outline: none;
            flex-grow: 1;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: РЕДАКТОР КОДА -->
    <div id="editor-screen" class="screen active">
        <h3>💻 Введи любой Python-код:</h3>
        <textarea id="codeArea" placeholder="print('Привет!')&#10;name = input('Как тебя зовут? ')&#10;print('Привет, ' + name)"></textarea>
        <button id="runBtn" onclick="startPython()">Запустить код 🚀</button>
    </div>

    <!-- ЭКРАН 2: ИНТЕРАКТИВНЫЙ ТЕРМИНАЛ -->
    <div id="output-screen" class="screen">
        <button class="back-btn" onclick="goBack()">⬅ Назад к коду</button>
        <h3>💻 Терминал выполнения:</h3>
        <div id="terminal" onclick="focusInput()">
            <div id="console-output">Инициализация...</div>
            <div id="input-area" class="input-line">
                <span id="prompt-text"></span>
                <input type="text" id="terminal-input" autocomplete="off" autofocus />
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let inputResolver = null;

        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        // Перехват команды input() из Python
        function customInputPrompt(promptText) {
            return new Promise((resolve) => {
                let outputDiv = document.getElementById("console-output");
                let inputArea = document.getElementById("input-area");
                let promptSpan = document.getElementById("prompt-text");
                let inputField = document.getElementById("terminal-input");

                // Показываем строку ввода прямо внутри черного терминала
                promptSpan.innerText = promptText || "";
                inputField.value = "";
                inputArea.style.display = "flex";
                
                setTimeout(() => inputField.focus(), 50);
                
                // Запоминаем функцию, которая вернет текст в Python после нажатия Enter
                inputResolver = resolve;
            });
        }

        // Ловим нажатие Enter в терминале
        document.getElementById("terminal-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                let value = this.value;
                let inputArea = document.getElementById("input-area");
                let promptSpan = document.getElementById("prompt-text");
                let outputDiv = document.getElementById("console-output");

                // Прячем строку ввода и печатаем введенный текст в общую консоль
                inputArea.style.display = "none";
                outputDiv.innerText += promptSpan.innerText + value + "\n";

                if (inputResolver) {
                    let resolveTemp = inputResolver;
                    inputResolver = null;
                    resolveTemp(value); // Передаем значение обратно в выполняющийся Python-код
                }
            }
        });

        function focusInput() {
            document.getElementById("terminal-input").focus();
        }

        function startPython() {
            let userCode = document.getElementById("codeArea").value;
            let outputDiv = document.getElementById("console-output");

            if (!userCode.trim()) {
                alert("Пожалуйста, напиши код!");
                return;
            }

            // Мгновенно переключаем экран на терминал
            document.getElementById("editor-screen").classList.remove("active");
            document.getElementById("output-screen").classList.add("active");
            outputDiv.innerText = "";
            outputDiv.style.color = "#00ff00";

            Sk.configure({
                output: function(text) {
                    outputDiv.innerText += text;
                    let term = document.getElementById("terminal");
                    term.scrollTop = term.scrollHeight; // Скролл вниз
                },
                read: builtinRead,
                inputfun: customInputPrompt, // Привязали наш интерактивный ввод данных
                inputisvisible: true
            });

            // Авто-исправление заглавной буквы Print от телефона
            let fixedCode = userCode.replace(/Print/g, "print");

            Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, fixedCode, true);
            }).then(function(mod) {
                if (outputDiv.innerText === "" && !inputResolver) {
                    outputDiv.innerText = "ℹ️ Код выполнен успешно, но ничего не вывел.";
                }
            }, function(err) {
                outputDiv.style.color = "#ff4d4d";
                outputDiv.innerText += "\n❌ Ошибка в коде:\n" + err.toString();
            });
        }

        function goBack() {
            document.getElementById("output-screen").classList.remove("active");
            document.getElementById("editor-screen").classList.add("active");
            document.getElementById("input-area").style.display = "none";
            inputResolver = null;
        }
    </script>
</body>
</html>
